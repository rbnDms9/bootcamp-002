openapi: 3.0.3
info:
  title: API de Productos
  version: 1.1.0
  description: |
    Servicio agregador PÚBLICO (detrás de Kong + Authelia): combina el catálogo
    (catalogo-service) con los descuentos (descuento-service) y calcula el precio final.
    CONTRATO PRIMERO: este archivo es la fuente de verdad del servidor; los clientes
    HTTP hacia catálogo y descuento se generan con los contratos de esos servicios.
  contact:
    name: Bootcamp EspecializATT
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://{dominio}
    description: Laboratorio (a través de Kong)
    variables:
      dominio:
        default: lab.bootcamp.local
        description: Dominio o IP pública de Kong
  - url: http://localhost:8080
    description: Desarrollo local

# La autenticación la hace el borde (Kong consulta a Authelia). Este servicio no valida
# la sesión, pero el contrato documenta qué necesita el consumidor para llamar la API.
security:
  - autheliaSession: []

tags:
  - name: Products
    description: Consulta de productos con precio final

paths:
  /api/v1/products:
    get:
      tags: [Products]
      summary: Listar productos con su precio final (paginado)
      operationId: listProducts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de productos con descuento aplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/products/{id}:
    get:
      tags: [Products]
      summary: Obtener un producto con su precio final
      description: |
        Si descuento-service no responde, el producto se entrega con 0% de descuento
        (degradación elegante). Si catalogo-service no responde, la respuesta es 503.
      operationId: getProductById
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del producto (entero positivo)
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
      responses:
        '200':
          description: Detalle del producto consolidado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    autheliaSession:
      type: apiKey
      in: cookie
      name: authelia_session
      description: Cookie de sesión que entrega Authelia al iniciar sesión (POST /authelia/api/firstfactor)

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Número de página, empieza en 0
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Elementos por página (máximo 100)
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Parámetros inválidos (por ejemplo, id menor a 1)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: "id debe ser mayor o igual a 1"
            instance: /api/v1/products/0
    NotFound:
      description: El producto no existe en el catálogo
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: "No existe el producto con ID 999"
            instance: /api/v1/products/999
    ServiceUnavailable:
      description: El catálogo no está disponible; reintentar más tarde
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            detail: "El catálogo no está disponible en este momento"
            instance: /api/v1/products/1

  schemas:
    ProductDetailResponse:
      type: object
      required: [id, name, basePrice, discountPercentage, finalPrice, stock]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          minLength: 1
          example: "Laptop Pro 14"
        basePrice:
          # 'number' SIN 'format' -> BigDecimal en Java (dinero)
          type: number
          minimum: 0
          description: Precio base en MXN, 2 decimales
          example: 25000.00
        discountPercentage:
          type: number
          minimum: 0
          maximum: 100
          description: Porcentaje aplicado (0 si no hay descuento o si descuento-service no responde)
          example: 10.00
        finalPrice:
          type: number
          minimum: 0
          description: basePrice - basePrice * discountPercentage / 100, redondeado a 2 decimales (HALF_UP)
          example: 22500.00
        stock:
          type: integer
          format: int32
          minimum: 0
          example: 15

    ProductPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductDetailResponse'
        page:
          type: integer
          format: int32
          example: 0
        size:
          type: integer
          format: int32
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 3
        totalPages:
          type: integer
          format: int32
          example: 1

    Problem:
      description: Error con formato estándar RFC 9457 (Problem Details for HTTP APIs)
      type: object
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          format: int32
          example: 404
        detail:
          type: string
          example: "No existe el producto con ID 999"
        instance:
          type: string
          example: /api/v1/products/999
